<svg xmlns="http://www.w3.org/2000/svg" width="80" height="112" viewBox="0 0 80 112">
  <title>Warm hand-drawn binder clip with two metal handles</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#f4d68f"/><stop offset="1" stop-color="#d5ac63"/>
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Broad spring body with a slight irregularity and rolled lower jaws. -->
    <path d="M18 63 Q39 59 61 63 L73 96 Q73 100 68 102 L12 102 Q7 101 8 97 Z" fill="#43362b" opacity=".13" transform="translate(1 2)"/>
    <path d="M19 61 Q39 58 60 61 L71 95 Q72 99 67 100 L12 100 Q7 99 9 95 Z" fill="url(#body)" stroke="#665240" stroke-width="2.4"/>
    <path d="M22 65 Q40 62 57 65 L65 91 Q42 89 16 92 Z" fill="#f6dfa8" stroke="#b68e52" stroke-width="1.3"/>
    <path d="M12 94 Q37 91 68 94 L69 99 Q42 102 11 99 Z" fill="#f7e6bc" stroke="#665240" stroke-width="2.2"/>
    <path d="M14 96 Q39 94 65 96" fill="none" stroke="#fff3d4" stroke-width="1.4"/>
    <!-- Back handle with rounded shoulders and two splayed metal legs. -->
    <path d="M23 66 L25 38 Q26 34 21 30 Q14 25 16 18 Q18 9 31 9 L48 9 Q61 10 63 18 Q65 26 58 31 Q53 34 54 39 L57 66" fill="none" stroke="#665240" stroke-width="7.6"/>
    <path d="M23 66 L25 38 Q26 34 21 30 Q14 25 16 18 Q18 9 31 9 L48 9 Q61 10 63 18 Q65 26 58 31 Q53 34 54 39 L57 66" fill="none" stroke="#fff1cc" stroke-width="3.6"/>
    <!-- Front handle wires continue down the clip face to the jaw sockets. -->
    <path d="M19 94 L29 42 Q30 37 25 32 Q19 28 22 21 Q25 16 34 16 L46 16 Q55 16 57 22 Q59 29 53 33 Q49 36 50 43 L61 94" fill="none" stroke="#665240" stroke-width="6.5"/>
    <path d="M19 94 L29 42 Q30 37 25 32 Q19 28 22 21 Q25 16 34 16 L46 16 Q55 16 57 22 Q59 29 53 33 Q49 36 50 43 L61 94" fill="none" stroke="#fff4d9" stroke-width="3.0"/>
    <path d="M17 94 Q20 92 23 94 M57 94 Q61 92 64 94" fill="none" stroke="#665240" stroke-width="2"/>
    <path d="M14 70 L10 87 M65 69 L69 83" fill="none" stroke="#fff0c6" stroke-width="1.5" opacity=".8"/>
  </g>
</svg>
