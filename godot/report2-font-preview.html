x #6f4c2744}.mini{position:absolute;width:170px;height:137px;padding:12px;background:#fff1d6;border-radius:9px;box-shadow:2px 4px 6px #50382055}.mini img{width:100%;height:100%;object-fit:contain}.mini.a{left:42px;top:20px;transform:rotate(-8deg)}.mini.b{right:36px;top:24px;transform:rotate(12deg)}.mini.c{left:102px;bottom:15px;transform:rotate(-4deg)}.mini.d{right:34px;bottom:17px;transform:rotate(-4deg)}.card{position:absolute;border:1px solid #e5d6bc;border-radius:18px;padding:27px;background:#fff4df;box-shadow:2px 7px 9px #72573833}.card img{width:100%;height:100%;object-fit:contain}.card.back{left:1468px;top:321px;width:298px;height:237px;transform:rotate(9deg)}.card.front{left:1060px;top:148px;width:478px;height:373px;transform:rotate(-7deg)}.tape{position:absolute;width:144px;height:43px;background:#f6ce67c9;box-shadow:1px 2px 3px #91774022;clip-path:polygon(3% 0,99% 4%,96% 24%,100% 45%,96% 64%,100% 98%,0 100%,3% 73%,0 45%)}.tape.one{left:214px;top:290px;transform:rotate(-29deg);width:104px}.tape.two{left:768px;top:633px;transform:rotate(-27deg);width:111px}.tape.three{left:1408px;top:105px;transform:rotate(12deg)}.tape.four{left:560px;top:955px;width:228px;transform:rotate(3deg)}.copy{font-size:34px;line-height:60px;letter-spacing:0;text-align:left;white-space:pre}.left-copy{left:200px;top:756px;width:640px}.right-copy{left:1068px;top:655px;width:665px}.question{left:1088px;top:859px;width:630px;font-size:38px}.question-line{left:1125px;top:919px;width:466px;transform:rotate(-3deg)}.bookmark{position:absolute;left:58px;top:159px;width:29px;height:439px;background:#91bbb3}.corner{position:absolute;right:94px;bottom:65px;width:173px;height:110px;background:#92b9ac;clip-path:polygon(100% 0,100% 100%,0 100%,21% 81%,29% 64%,45% 55%,58% 31%,73% 26%)}.arrow{position:absolute;left:874px;top:425px;width:177px;height:100px}.loading{position:fixed;inset:0;display:grid;place-items:center}.ready .loading{display:none}.tools{position:fixed;right:12px;top:8px;z-index:5;font:12px ProjectSans,sans-serif}.tools summary{cursor:pointer;opacity:.4;text-align:right}.tools[open] summary,.tools:hover summary{opacity:1}.panel{background:#fff7e9;border:1px solid #cabb9f;padding:16px;line-height:1.8;max-width:430px}button,a{font:inherit;color:inherit}button{background:#fffaf0;border:1px solid #b7a98c;border-radius:5px;padding:6px 10px;cursor:pointer}#status{color:#526e60}.capture .tools{display:none}
</style>
<body>
<div class="loading" role="status">正在加载字体…</div>
<details class="tools"><summary>字体预览设置</summary><div class="panel"><div>字体：叶利航九龄卡通 Regular</div><div id="status" role="status">正在加载字体…</div><div>正文为可选择的真实文字，系统文字使用思源黑体。</div><button id="copy">复制本页正文</button> <a href="./font-preview.html">第一份报告</a><div><a href="./assets/fonts/REPORT-FONT-LICENSE.md">字体授权与覆盖核查</a></div></div></details>
<div class="viewport"><main class="frame" aria-label="第二份进步报告，3月4日">
<div class="cover" aria-hidden="true"></div><div class="bookmark" aria-hidden="true"></div><div class="pages" aria-hidden="true"></div><div class="fold" aria-hidden="true"></div>
<p class="date" id="date"></p><div class="underline date-line" aria-hidden="true"></div><h1 class="title" id="title"></h1><div class="underline title-line" aria-hidden="true"></div>
<div class="board-mat" aria-hidden="true"></div><div class="board" aria-label="四张墨迹卡片照片拼贴"><div class="mini a"><img src="./assets/continuation/ink-4.png" alt="彩色墨迹"></div><div class="mini b"><img src="./assets/continuation/ink-3.png" alt="展开的墨迹"></div><div class="mini c"><img src="./assets/continuation/ink-2.png" alt="深色对称墨迹"></div><div class="mini d"><img src="./assets/continuation/ink-1.png" alt="小墨迹卡片"></div></div>
<div class="card back"><img src="./assets/continuation/ink-1.png" alt="右页小墨迹卡片"></div><div class="card front"><img src="./assets/continuation/ink-2.png" alt="右页放大的墨迹卡片"></div>
<div class="tape one" aria-hidden="true"></div><div class="tape two" aria-hidden="true"></div><div class="tape three" aria-hidden="true"></div><div class="tape four" aria-hidden="true"></div>
<svg class="arrow" viewBox="0 0 177 100" aria-hidden="true"><path d="M7 85C68 93 110 56 165 12m-20 1 21-2-5 20" fill="none" stroke="#82705b" stroke-width="2.5" stroke-linecap="round"/></svg>
<p class="copy left-copy" id="left"></p><p class="copy right-copy" id="right"></p><p class="copy question" id="question"></p><div class="underline question-line" aria-hidden="true"></div><div class="corner" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
</main></div>
<script src="./font-preview-data.js"></script>
<script>
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
const report=REPORT_PREVIEW.find(r=>r.id==='report2');
const [date,...body]=report.text.split('\n\n')[0].split('\n');
window.previewText=body.join('\n');
// Keep source characters; only line breaks are added for this fixed composition.
const sentences=window.previewText.match(/[^。]+。/gu);
if(!sentences||sentences.length!==6||sentences.join('')!==window.previewText)throw Error('Unexpected report text; review layout before displaying');
document.querySelector('#date').textContent=date;document.querySelector('#title').textContent=report.title;
document.querySelector('#left').textContent=sentences.slice(0,3).join('\n');
document.querySelector('#right').textContent=sentences[3].replace('找不到','找不到\n')+sentences[4];
document.querySelector('#question').textContent=sentences[5];
function fit(){window.reportScale=Math.min(innerWidth/1920,innerHeight/1080);document.querySelector('.frame').style.transform=`scale(${window.reportScale})`}addEventListener('resize',fit);fit();
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(window.previewText);document.querySelector('#copy').textContent='已复制正文'}catch{document.querySelector('#copy').textContent='请直接选中文字复制'}};
window.layoutReady=Promise.all([document.fonts.load('34px ReportHand',report.title+window.previewText),document.fonts.load('14px ProjectSans','复制本页正文')]).then(async([hand,sans])=>{if(!hand.length||!sans.length)throw Error('Font unavailable');await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));document.querySelector('#status').textContent='项目字体已加载';document.body.classList.add('ready');return true}).catch(e=>{document.querySelector('.loading').textContent='字体或素材加载失败，请检查项目文件';throw e});
</script>
</body></html>
