<style>

*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#d8cebc;color:#493f30;font:14px ProjectSans,'Microsoft YaHei',sans-serif}.viewport{position:absolute;inset:0;display:grid;place-items:center}.frame{position:absolute;width:1920px;height:1080px;transform-origin:center;background:radial-gradient(ellipse,#e8e0d0,#c4b8a7);font-family:ReportHand,ProjectSans,sans-serif;font-synthesis:none;visibility:hidden}.ready .frame{visibility:visible}.cover{position:absolute;inset:26px 40px 28px;border:10px solid #d8ab40;border-radius:40px;background:#eed39b;box-shadow:0 8px 18px #513e3a66,inset 0 0 0 3px #f8d779}.pages{position:absolute;inset:39px 58px 44px;border:1px solid #c6af88;border-radius:28px;background:linear-gradient(90deg,#f1e2c9,#fff5df 4%,#fff4de 47%,#d6c5a5 49.8%,#ecddc1 50.2%,#fff5e3 53%,#fcf0d9 96%,#e4d1ac);box-shadow:inset 0 0 0 5px #f7edda,inset 0 0 0 9px #dfccac,0 1px 4px #6d4f2e55}.left-sheet{position:absolute;left:108px;top:80px;width:830px;height:930px;background:linear-gradient(105deg,#fff0ce,#fff1d5 70%,#fae9c4);box-shadow:1px 3px 5px #80642a22;transform:rotate(-.3deg)}.fold{position:absolute;left:948px;top:64px;width:12px;height:956px;border-radius:50%;background:linear-gradient(90deg,#e9dcc4,#ae98754d,#fff6e3);opacity:.55}.grain{position:absolute;inset:0;pointer-events:none;opacity:.13;background:url('./assets/report/paper-grain.svg');mix-blend-mode:multiply}.title,.date,.copy{position:absolute;margin:0;font-weight:400}.title{left:160px;top:103px;font-size:40px;line-height:58px}.date{left:160px;top:166px;font-size:32px;line-height:48px}.copy{font-size:30px;line-height:48px;letter-spacing:0;text-align:left}.line{display:block;white-space:pre;height:48px}.left-copy{left:160px;top:246px;width:700px}.right-copy{left:1000px;top:585px;width:730px}.art{mask-image:linear-gradient(to right,transparent,#000 12px,#000 calc(100% - 12px),transparent),linear-gradient(to bottom,transparent,#000 12px,#000 calc(100% - 12px),transparent);mask-composite:intersect;position:absolute;overflow:hidden;pointer-events:none}.art img{position:absolute;width:1920px;height:1080px;max-width:none;user-select:none}.left-art{left:145px;top:540px;width:747px;height:465px}.left-art img{left:-155px;top:-539px}.right-art{clip-path:polygon(0 0,100% 0,100% 96%,85% 96%,85% 100%,0 100%);left:1000px;top:95px;width:792px;height:420px}.right-art img{left:-996px;top:-90px}.cheese-art{left:1740px;top:505px;width:112px;height:112px}.cheese-art img{left:-1700px;top:-494px}.tools{position:fixed;right:12px;top:8px;z-index:5;font:12px ProjectSans,sans-serif}.tools summary{cursor:pointer;opacity:.4;text-align:right}.tools[open] summary,.tools:hover summary{opacity:1}.panel{padding:16px;background:#fff8ec;border:1px solid #c8b99a;max-width:430px;line-height:1.9}button{font:inherit;color:inherit;background:#fffaf0;border:1px solid #b6aa91;border-radius:5px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#658e85;color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #bd9234;outline-offset:3px}a{color:inherit}#status{color:#526d60}.loading{position:fixed;inset:0;display:grid;place-items:center}.ready .loading{display:none}.capture .tools{display:none}
</style>
<body><div class="loading" role="status">正在加载字体…</div>
<details class="tools"><summary>两版预览</summary><div class="panel"><button id="real" aria-pressed="true">写实迷宫版</button> <button id="cartoon" aria-pressed="false">卡通迷宫版</button><div id="status" role="status">正在加载字体…</div><div>叶利航九龄卡通 · 正文 30px / 行高 48px</div><div>系统文字：思源黑体 · 1920 × 1080 等比缩放</div><a href="./report2-font-preview.html">3月4日报告</a> · <a href="./assets/fonts/REPORT-FONT-LICENSE.md">授权与字形覆盖核查</a></div></details>
<div class="viewport"><main class="frame" aria-label="进步抱告—2，3月6日">
<div class="cover" aria-hidden="true"></div><div class="pages" aria-hidden="true"></div><div class="left-sheet" aria-hidden="true"></div><div class="fold" aria-hidden="true"></div>
<h1 id="title" class="title"></h1><p id="date" class="date"></p><p id="left" class="copy left-copy"></p>
<!-- Viewports display only the illustration regions of the supplied references. No reference body text is displayed. -->
<div class="art left-art"><img id="left-image" alt="写实迷宫照片与白鼠、奶酪贴纸"></div><div class="art right-art"><img id="right-image" alt="医生、研究员和查理的合照拼贴"></div><div class="art cheese-art"><img id="cheese-image" alt="奶酪插画"></div>
<p id="right" class="copy right-copy"></p><div class="grain" aria-hidden="true"></div>
</main></div>
<script src="./font-preview-data.js"></script>
<script>
const query=new URLSearchParams(location.search);if(query.has('capture'))document.body.classList.add('capture');
const leftReport=REPORT_PREVIEW.find(r=>r.id==='report2-0306-maze'),rightReport=REPORT_PREVIEW.find(r=>r.id==='report2-0306-decision');
document.querySelector('#title').textContent=leftReport.title;document.querySelector('#date').textContent=leftReport.date;
const frame=document.querySelector('.frame');function fit(){window.reportScale=Math.min(innerWidth/1920,innerHeight/1080);frame.style.transform=`scale(${window.reportScale})`}addEventListener('resize',fit);fit();
const protectedWords=['斯特劳斯','考是','为什么','拼字','望记','伯特','阿尔吉侬','迷工','白老鼠','每次','怎么','找路','诺尔玛','同意','手术','新奇','动鸡','奶酪','星期','尼姆教授','可能','一点','鸡会','学过','它每次','吃过','新奇得','一阵子'];
function wrap(el,text,width){const ctx=document.createElement('canvas').getContext('2d');ctx.font='30px ReportHand';const chars=[...text],measure=(a,b)=>ctx.measureText(chars.slice(a,b).join('')).width,forbidden=new Set();
 for(const word of protectedWords){let from=0,p;while((p=text.indexOf(word,from))!==-1){for(let k=p+1;k<p+word.length;k++)forbidden.add(k);from=p+word.length}}
 const allowed=i=>!forbidden.has(i)&&!/^[，。！？；：、）》」』】…—·]/u.test(chars[i]||'')&&!/[（《「『【]$/u.test(chars[i-1]||'');let count=Math.ceil(measure(0,chars.length)/width),answer;
 for(;count<=chars.length&&!answer;count++){const memo=new Map(),target=measure(0,chars.length)/count;function solve(start,left){const key=start+','+left;if(memo.has(key))return memo.get(key);if(!left)return start===chars.length?{cost:0,ends:[]}:null;let best=null;
  for(let end=start+1;end<=chars.length;end++){const w=measure(start,end);if(w>width+.01)break;if(end<chars.length&&!allowed(end))continue;if(left===1&&(end!==chars.length||end-start<5))continue;const tail=solve(end,left-1);if(!tail)continue;let cost=(w-target)**2+tail.cost;if(/[。！？]/u.test(chars[end-1]))cost-=150;if(!best||cost<best.cost)best={cost,ends:[end,...tail.ends]}}memo.set(key,best);return best}answer=solve(0,count)}
 el.replaceChildren();let start=0;for(const end of answer.ends){const line=document.createElement('span');line.className='line';line.textContent=chars.slice(start,end).join('');el.append(line);start=end}}
window.setVariant=async variant=>{document.body.classList.remove('ready');window.variant=variant==='cartoon'?'cartoon':'real';const src=`./assets/report/march6-${window.variant}.png`;for(const id of ['left-image','right-image','cheese-image'])document.getElementById(id).src=src;document.querySelector('#left-image').alt=window.variant==='real'?'写实迷宫照片与白鼠、奶酪贴纸':'卡通查理迷宫照片与白鼠、奶酪贴纸';for(const id of ['real','cartoon'])document.getElementById(id).setAttribute('aria-pressed',String(window.variant===id));await Promise.all([...document.images].map(i=>i.decode()));document.body.classList.add('ready');return true};
document.querySelector('#real').onclick=()=>window.setVariant('real');document.querySelector('#cartoon').onclick=()=>window.setVariant('cartoon');
window.layoutReady=Promise.all([document.fonts.load('30px ReportHand',leftReport.title+leftReport.date+leftReport.text+rightReport.text),document.fonts.load('14px ProjectSans','写实迷宫版卡通迷宫版')]).then(async([hand,sans])=>{if(!hand.length||!sans.length)throw Error('Font unavailable');await document.fonts.ready;wrap(document.querySelector('#left'),leftReport.text,700);wrap(document.querySelector('#right'),rightReport.text,730);await window.setVariant(query.get('variant'));document.querySelector('#status').textContent='项目字体已加载';return true}).catch(e=>{document.querySelector('.loading').textContent='字体或图片加载失败，请检查项目资源';throw e});
</script></body></html>
