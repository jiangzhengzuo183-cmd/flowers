<script>
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
const report=MARCH8_REPORT;document.querySelector('#title').textContent=report.title;document.querySelector('#date').textContent=report.date;
const frame=document.querySelector('.frame');function fit(){window.reportScale=Math.min(innerWidth/1920,innerHeight/1080);frame.style.transform=`scale(${window.reportScale})`}addEventListener('resize',fit);fit();
function displayLines(el,original,lines){if(lines.join('')!==original)throw Error('Layout must preserve every supplied character');el.replaceChildren();for(const text of lines){const span=document.createElement('span');span.className='line';span.textContent=text;el.append(span)}}
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(report.paragraphs.join('\n\n'));document.querySelector('#copy').textContent='已复制正文'}catch{document.querySelector('#copy').textContent='请直接选中文字复制'}};
window.layoutReady=Promise.all([document.fonts.load('30px ReportHand',report.title+report.date+report.paragraphs.join('')),document.fonts.load('14px ProjectSans','复制正文')]).then(async([hand,sans])=>{if(!hand.length||!sans.length)throw Error('Font unavailable');await document.fonts.ready;
displayLines(document.querySelector('#left'),report.paragraphs[0],['乔伊来唐纳先生给我的巧克力旦高。','医生说手术前不能吃。']);
displayLines(document.querySelector('#middle'),report.paragraphs[1],['爱丽丝老师代来杂志还帮','我把东西整理好。我拿着','幸运兔脚就不那么怕。']);
displayLines(document.querySelector('#bottom'),report.paragraphs[2],['我不要便有名。我只想读懂更多东西和','大家说话。']);
await Promise.all([...document.images].map(i=>i.decode()));document.querySelector('.middle-underline').style.top=(365+document.querySelector('#middle').offsetHeight+14)+'px';document.querySelector('.bottom-underline').style.top=(825+document.querySelector('#bottom').offsetHeight+14)+'px';document.querySelector('#status').textContent='项目字体已加载';document.body.classList.add('ready');return true}).catch(e=>{document.querySelector('.loading').textContent='字体或图片加载失败，请检查项目资源';throw e});
</script></body></html>
